<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · 面试练习室</title><link rel="stylesheet" href="/style.css"></head><body class="login-page"><main class="panel login-card"><div class="eyebrow">INTERVIEW STUDIO</div><h1>进入你的练习室。</h1><p>登录后，继续准备下一场面试。</p><form action="/login" method="post" id="login-form"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" value="owner" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="login-error" class="error" role="alert" hidden></p><button class="button primary" id="login-button" type="submit" disabled>登录 →</button></form><p class="muted">使用云端 APP_USERNAME / APP_PASSWORD 设置的账号。</p></main><script src="/login.js" type="module"></script></body></html>
