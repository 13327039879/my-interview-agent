<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183f35"><title>面试练习室 · Interview Studio</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="/" aria-label="面试练习室首页"><span class="brand-icon">i<span>·</span></span><span>面试练习室<small>INTERVIEW STUDIO</small></span></a>
<div class="sidebar-label">你的练习空间</div><nav aria-label="主导航"><button data-nav="setup" class="nav active"><span>◈</span> 面试准备</button><button data-nav="interview" class="nav"><span>◉</span> 模拟面试 <i id="live-dot" hidden></i></button><button data-nav="history" class="nav"><span>▤</span> 练习记录</button></nav>
<div class="sidebar-note"><span class="small-cap">A LITTLE BETTER, EVERY TIME</span><p>把经历讲清楚，<br>让下一次更从容。</p><span class="note-line"></span></div>
<button class="nav settings-nav" data-nav="settings"><span>⚙</span> 模型与数据</button><div class="local-note"><span class="dot"></span> 资料保存在当前浏览器</div></aside>
<div class="shell"><header class="topbar"><span id="breadcrumb">工作台 / 面试准备</span><div class="top-right"><span id="connection" class="badge">检查连接中</span><span class="avatar">你</span></div></header>
<main id="main"></main><div id="toast" role="status" hidden></div></div>
<template id="setup-template"><section class="heading"><div><div class="eyebrow">PREPARE WITH PURPOSE</div><h1>下一场面试，从这里开始<span>。</span></h1><p>带上你的经历和目标岗位，练习那些真正重要的问题。</p></div><span class="edition">个人练习 · v0.1</span></section>
<div class="setup-grid"><section class="panel setup-panel"><div class="panel-heading"><h2><span class="step">01</span> 准备面试素材</h2><span class="muted">仅需几分钟</span></div>
<form id="setup-form"><label for="role">目标岗位 <span class="required">*</span></label><input id="role" name="role" maxlength="120" placeholder="例如：Engineering Manager / 后端工程师" required>
<div class="field-heading"><label for="resume">你的经历</label><label class="file-label" for="resume-file">导入 TXT / Markdown ↗</label><input type="file" id="resume-file" accept=".txt,.md,text/plain,text/markdown" hidden></div><textarea id="resume" name="resume" rows="5" maxlength="18000" placeholder="粘贴简历或项目经历。建议包含：背景、你的职责、关键决策、结果。缺少的事实可以留空。"></textarea><div class="field-hint"><span>越具体，追问越贴近你</span><span id="resume-count">0 / 18,000</span></div>
<label for="jd">目标岗位 JD <span class="muted">· 岗位匹配 / 综合面试必填</span></label><textarea id="jd" name="jd" rows="4" maxlength="12000" placeholder="粘贴职位描述：核心职责、技能要求、团队与业务背景。"></textarea>
<div class="panel-heading second"><h2><span class="step">02</span> 选择练习方式</h2></div><fieldset class="style-picker"><legend class="sr-only">面试风格</legend><label class="choice"><input type="radio" name="style" value="coach" checked><span><b>◌ 逐题教练</b><small>每次回答后给反馈，边练边改</small></span></label><label class="choice"><input type="radio" name="style" value="realistic"><span><b>◎ 连续追问</b><small>过程中不提示，结束后集中复盘</small></span></label></fieldset>
<div class="select-row"><div><label for="type">考察方向</label><select id="type" name="type"><option value="behavioral">行为与项目经历</option><option value="job">岗位匹配</option><option value="mixed">综合面试</option></select></div><div><label for="language">面试语言</label><select id="language" name="language"><option value="zh">中文</option><option value="en">English</option></select></div><div><label for="rounds">回答轮数（含追问）</label><select id="rounds" name="rounds"><option value="4">4 轮 · 快速练习</option><option value="6" selected>6 轮 · 标准练习</option><option value="8">8 轮 · 深度练习</option></select></div></div>
<div class="form-actions"><button type="button" id="prepare" class="button secondary">生成准备清单</button><button type="submit" class="button primary" id="start">开始 AI 面试 <span>↗</span></button></div><p class="privacy">AI 模式会将本次素材和回答发送到所配置的模型服务。密钥只保存在服务端。</p><div id="setup-error" class="error" role="alert" hidden></div></form></section>
<aside class="right-column"><section class="intro-card"><div class="small-cap">YOUR PERSONAL PRACTICE PARTNER</div><div class="orbit" aria-hidden="true"><div class="orbit-ring"></div><span class="orbit-core">✦</span><i class="orbit-dot"></i></div><h2>一次练习，<br>一份更清晰的表达。</h2><p>从真实经历出发，让每一次追问都有依据，让每一条反馈可以行动。</p><div class="intro-bottom"><span>准备</span><b>→</b><span>练习</span><b>→</b><span>复盘</span></div></section>
<section class="panel compact"><h3>这次练习，你会获得</h3><ul class="benefits"><li><span>01</span><div><b>有针对性的提问</b><p>结合岗位要求和你的项目经历</p></div></li><li><span>02</span><div><b>基于回答的追问</b><p>深入个人贡献、决策与真实结果</p></div></li><li><span>03</span><div><b>有证据的复盘</b><p>引用你的回答，定位下一步练习</p></div></li></ul></section>
<div class="demo-card"><span>先感受一下练习节奏？</span><button id="demo" class="text-button">体验流程演示 →</button><small>固定示例问题 · 不调用 AI · 不评估能力</small></div></aside></div><section id="prep-result"></section></template>
<script type="module" src="/app.js"></script></body></html>
